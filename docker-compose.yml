# Neo4j and Redis for this playbook, the same as the README's docker run commands:
#   docker run -d --name pb06-neo4j -p 7474:7474 -p 7687:7687 -e NEO4J_AUTH=neo4j/changeThisPassword neo4j:2026.10
#   docker run -d --name pb06-redis -p 6379:6379 redis:8
# Use one or the other. Start with `make services` (or `docker compose up -d --wait`).
# Stop with `make services-stop` (or `docker compose down`).
# If Neo4j or Redis already runs on this machine, pick other host ports, for example
#   NEO4J_HTTP_PORT=7475 NEO4J_BOLT_PORT=7688 REDIS_PORT=6380 NEO4J_URI=bolt://localhost:7688 make run
services:
  neo4j:
    image: neo4j:2026.10
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/changeThisPassword
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeThisPassword", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
